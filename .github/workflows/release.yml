name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the changes."
            git diff dist/
            exit 1
          fi

  e2e:
    needs: verify
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/e2e.yml
    with:
      # Closed PR #19 is the standing target; each run deletes the comments it creates.
      pr-number: "19"

  release:
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
      - name: Update major version tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          MAJOR="${REF_NAME%%.*}"
          if [[ ! "$MAJOR" =~ ^v[0-9]+$ ]]; then
            echo "Tag '$REF_NAME' does not match vX.Y.Z; skipping major tag move."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$REF_NAME"
          git push origin "$MAJOR" --force
